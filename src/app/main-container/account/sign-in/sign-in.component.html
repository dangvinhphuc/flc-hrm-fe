<div class="sign-in-container">
  <div class="sign-in-card">
    <h2 class="form-title">Sign in</h2>

    <form
      nz-form
      nzLayout="vertical"
      [formGroup]="signInForm"
      (ngSubmit)="submitForm()"
    >
      <nz-form-item>
        <nz-form-label nzFor="email" nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid email">
          <input
            nz-input
            type="email"
            formControlName="email"
            id="email"
            placeholder="Email"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzRequired>Password</nz-form-label>
        <nz-form-control nzErrorTip="Password required">
          <nz-input-group [nzSuffix]="passwordIcon">
            <input
              nz-input
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              id="password"
              placeholder="Password"
            />
          </nz-input-group>
          <ng-template #passwordIcon>
            <i
              nz-icon
              [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
              (click)="passwordVisible = !passwordVisible"
            ></i>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control>
          <div class="button-container">
            <button
              nz-button
              nzType="primary"
              [disabled]="signInForm.invalid"
              [nzLoading]="loading"
            >
              Sign in
            </button>
            <button
              nz-button
              nzType="default"
              type="reset"
              (click)="signInForm.reset()"
            >
              Reset
            </button>
          </div>
        </nz-form-control>
      </nz-form-item>
    </form>
  </div>
</div>
