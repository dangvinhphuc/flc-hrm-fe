<div class="register-container">
  <div class="register-card">
    <h2 class="form-title">User Registration</h2>

    <form
      nz-form
      nzLayout="vertical"
      [formGroup]="registerForm"
      (ngSubmit)="submitForm()"
    >
      <nz-form-item>
        <nz-form-label nzFor="firstName" nzRequired>First name</nz-form-label>
        <nz-form-control nzErrorTip="First name must be 2-50 characters">
          <input
            nz-input
            formControlName="firstName"
            id="firstName"
            placeholder="John"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="lastName" nzRequired>Last name</nz-form-label>
        <nz-form-control nzErrorTip="Last name must be 2-50 characters">
          <input
            nz-input
            formControlName="lastName"
            id="lastName"
            placeholder="Doe"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="email" nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid email">
          <input
            nz-input
            type="email"
            formControlName="email"
            id="email"
            placeholder="name@example.com"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzRequired>Password</nz-form-label>
        <nz-form-control nzErrorTip="Password must be at least 8 characters">
          <nz-input-group [nzSuffix]="passwordIcon">
            <input
              nz-input
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              id="password"
              placeholder="At least 8 characters"
              (input)="updateConfirmValidator()"
            />
          </nz-input-group>
          <ng-template #passwordIcon>
            <i
              nz-icon
              [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
              (click)="passwordVisible = !passwordVisible"
            ></i>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="confirmPassword" nzRequired
          >Confirm Password</nz-form-label
        >
        <nz-form-control
          [nzErrorTip]="
            registerForm.get('confirmPassword')?.hasError('required')
              ? 'Please confirm your password'
              : 'Passwords do not match'
          "
        >
          <nz-input-group [nzSuffix]="confirmPasswordIcon">
            <input
              nz-input
              [type]="confirmPasswordVisible ? 'text' : 'password'"
              formControlName="confirmPassword"
              id="confirmPassword"
              placeholder="Re-enter your password"
            />
          </nz-input-group>
          <ng-template #confirmPasswordIcon>
            <i
              nz-icon
              [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'"
              (click)="confirmPasswordVisible = !confirmPasswordVisible"
            ></i>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="role" nzRequired>Role</nz-form-label>
        <nz-form-control nzErrorTip="Please select a role">
          <nz-select
            formControlName="role"
            id="role"
            nzPlaceHolder="Select a role"
          >
            @for (r of roles; track r.value) {
            <nz-option [nzValue]="r.value" [nzLabel]="r.label"></nz-option>
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control>
          <div class="button-container">
            <button
              nz-button
              nzType="primary"
              [disabled]="registerForm.invalid"
            >
              Create Account
            </button>
            <button
              nz-button
              nzType="default"
              type="reset"
              (click)="registerForm.reset()"
            >
              Reset
            </button>
          </div>
        </nz-form-control>
      </nz-form-item>
    </form>
  </div>
</div>
