<div>
  <form nz-form [formGroup]="positionInfoForm" (ngSubmit)="submitForm()">
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6">Code</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="code" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6"
            >Full Name</nz-form-label
          >
          <nz-form-control>
            <input nz-input formControlName="fullName" />
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6"
            >Department</nz-form-label
          >
          <nz-form-control>
            <nz-select formControlName="departmentId">
              <nz-option [nzLabel]="'HR'" [nzValue]="'HR'"></nz-option>
              <nz-option [nzLabel]="'FO'" [nzValue]="'FO'"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6"
            >Property</nz-form-label
          >
          <nz-form-control>
            <nz-select formControlName="propertyId">
              <nz-option [nzLabel]="'LUX'" [nzValue]="'LUX'"></nz-option>
              <nz-option [nzLabel]="'GRAND'" [nzValue]="'GRAND'"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6">Outlet</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="outletId">
              <nz-option
                [nzLabel]="'GENERAL'"
                [nzValue]="'GENERAL'"
              ></nz-option>
              <nz-option [nzLabel]="'HOTEL'" [nzValue]="'HOTEL'"></nz-option>
              <nz-option [nzLabel]="'RESORT'" [nzValue]="'RESORT'"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6"
            >Position</nz-form-label
          >
          <nz-form-control>
            <nz-select formControlName="positionId">
              <nz-option
                [nzLabel]="'Manager'"
                [nzValue]="'Manager'"
              ></nz-option>
              <nz-option [nzLabel]="'Staff'" [nzValue]="'Staff'"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6">Level</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="level">
              <nz-option [nzLabel]="'1'" [nzValue]="'1'"></nz-option>
              <nz-option [nzLabel]="'2'" [nzValue]="'2'"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6"
            >Starting Date</nz-form-label
          >
          <nz-form-control>
            <nz-date-picker
              class="date-picker"
              formControlName="startingDate"
              [nzPlaceHolder]="'Select date'"
              [nzAllowClear]="false"
            ></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzLabelAlign="left" [nzSpan]="6"
            >Contract Type</nz-form-label
          >
          <nz-form-control>
            <nz-select formControlName="contractType">
              <nz-option
                [nzLabel]="'Official'"
                [nzValue]="'Official'"
              ></nz-option>
              <nz-option [nzLabel]="'Casual'" [nzValue]="'Casual'"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </form>
</div>
<div nz-flex nzJustify="end" nzGap="small">
  <button nz-button nzType="primary">Edit</button>
  <button nz-button nzType="default">Save</button>
  <button nz-button nzType="default">Cancel</button>
</div>
