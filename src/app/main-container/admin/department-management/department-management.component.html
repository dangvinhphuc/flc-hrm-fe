<div class="container">
  <button nz-button nzType="primary" (click)="openAddModal()">
    <span nz-icon nzType="plus"></span>
    Add New
  </button>

  <nz-table
    #departmentTable
    [nzBordered]="true"
    [nzData]="listOfData"
    [nzFrontPagination]="false"
    [nzShowPagination]="false"
  >
    <thead>
      <tr>
        <th
          nzWidth="50px"
          nzShowCheckbox
          [(nzChecked)]="checkedAll"
          (nzCheckedChange)="onAllChecked($event)"
        ></th>
        <th>Short Name</th>
        <th>EN Full Name</th>
        <th>VI Full Name</th>
        <th nzWidth="150px">Action</th>
      </tr>
    </thead>
    <tbody>
      @for (item of departmentTable.data; track item) {
      <tr>
        <td
          nzShowCheckbox
          [nzChecked]="setOfCheckedId.has(item.id)"
          (nzCheckedChange)="onItemChecked(item.id, $event)"
        ></td>
        <td>
          <nz-tag nzColor="#2E68AB">
            {{ item.shortName }}
          </nz-tag>
        </td>
        <td>{{ item.enFullName }}</td>
        <td>{{ item.viFullName }}</td>
        <td>
          <a nz-dropdown [nzDropdownMenu]="menu" nzTrigger="click">
            <i nz-icon nzType="menu" nzTheme="outline"></i>
          </a>
          <nz-dropdown-menu #menu="nzDropdownMenu">
            <ul nz-menu>
              <li nz-menu-item (click)="openEditModal(item)">
                <span>
                  <i nz-icon nzType="edit" nzTheme="outline"></i>
                  Edit
                </span>
              </li>
              <li
                class="danger-item"
                nz-menu-item
                (click)="confirmDelete(item.id)"
              >
                <span>
                  <i nz-icon nzType="delete" nzTheme="outline"></i>
                  Delete
                </span>
              </li>
            </ul>
          </nz-dropdown-menu>
        </td>
      </tr>
      }
    </tbody>
  </nz-table>

  <nz-modal
    [(nzVisible)]="isModalVisible"
    [nzTitle]="isEditMode ? 'Edit Department' : 'Add New Department'"
    [nzOkLoading]="isSubmitting"
    [nzFooter]="modalFooter"
    (nzOnCancel)="handleCancel()"
  >
    <ng-container *nzModalContent>
      <form [formGroup]="form" nz-form nzLayout="vertical">
        <nz-form-item>
          <nz-form-label nzFor="shortName" nzRequired>Short Name</nz-form-label>
          <nz-form-control nzErrorTip="Required">
            <input
              nz-input
              formControlName="shortName"
              id="shortName"
              placeholder="Enter short name"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzFor="enFullName" nzRequired
            >EN Full Name</nz-form-label
          >
          <nz-form-control nzErrorTip="Required">
            <input
              nz-input
              formControlName="enFullName"
              id="enFullName"
              placeholder="Enter EN full name"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzFor="viFullName" nzRequired
            >VI Full Name</nz-form-label
          >
          <nz-form-control nzErrorTip="Required">
            <input
              nz-input
              formControlName="viFullName"
              id="viFullName"
              placeholder="Enter VI full name"
            />
          </nz-form-control>
        </nz-form-item>
      </form>
    </ng-container>
    <ng-template #modalFooter>
      <div class="modal-footer">
        <button
          nz-button
          nzType="default"
          class="modal-btn"
          (click)="handleCancel()"
        >
          Cancel
        </button>
        <button
          nz-button
          nzType="primary"
          class="modal-btn"
          (click)="handleOk()"
        >
          Save
        </button>
      </div>
    </ng-template>
  </nz-modal>
</div>
